<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00AAFF" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var t = localStorage.getItem('engie-demo-theme');
        if (t === 'system') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
      // If one of the app's own script files fails to download (a dropped request), the app cannot start
      // and the page would stay blank. Reload once; `src/lib/recover.ts` clears the mark when the app is up.
      window.addEventListener(
        'error',
        function (e) {
          var el = e.target;
          if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK')) return;
          try {
            if (sessionStorage.getItem('engie-demo-recovering')) return;
            sessionStorage.setItem('engie-demo-recovering', '1');
          } catch (x) {
            return;
          }
          location.reload();
        },
        true
      );
    </script>
    <title>MijnENGIE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
